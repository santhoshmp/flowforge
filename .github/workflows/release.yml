name: Release

# P3 distribution: tag v* → build the cross-compile matrix (scripts/build.sh),
# SBOM (syft), cosign keyless signatures over every artifact, the container
# image on ghcr, and a GitHub Release. See docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # cosign keyless signing
  packages: write   # push the image to ghcr.io

jobs:
  release:
    name: Binaries + SBOM + signatures + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- UI → embedded into the binary -------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dsl/package-lock.json
            app/package-lock.json
      - name: Build contract + UI
        run: |
          npm --prefix dsl ci
          npm --prefix dsl run build
          npm --prefix app ci
          npm --prefix app run build
          rm -rf server-go/ui/dist
          mkdir -p server-go/ui/dist
          cp -r app/dist/* server-go/ui/dist/

      # ---- cross-compile matrix + checksums -----------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
      - name: Build distribution matrix
        run: bash scripts/build.sh "${GITHUB_REF_NAME}"

      # ---- SBOM ----------------------------------------------------------------
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: flowforge-sbom.spdx.json
          output-file: dist/flowforge-sbom.spdx.json
          format: spdx-json
          # Scan the linux/amd64 binary directory contents.
          path: dist

      # ---- cosign keyless signatures -------------------------------------------
      - name: Sign artifacts (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - name: Sign all release files
        run: |
          set -euo pipefail
          cd dist
          for f in flowforge-* SHA256SUMS; do
            case "$f" in *.sig|*.pem) continue ;; esac   # never sign signatures
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
            if [ ! -s "$f.sig" ] || [ ! -s "$f.pem" ]; then
              echo "signing produced no output for $f" >&2
              exit 1
            fi
          done

      # ---- completeness gate: every expected artifact must exist ---------------
      - name: Verify expected artifacts exist
        run: |
          set -euo pipefail
          cd dist
          missing=0
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=tar.gz; [ "$os" = windows ] && ext=zip
              for suffix in "" ".sig" ".pem"; do
                f="flowforge-${GITHUB_REF_NAME}-${os}-${arch}.${ext}${suffix}"
                if [ ! -s "$f" ]; then echo "MISSING $f"; missing=1; fi
              done
            done
          done
          for f in flowforge-sbom.spdx.json flowforge-sbom.spdx.json.sig flowforge-sbom.spdx.json.pem \
                   SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            if [ ! -s "$f" ]; then echo "MISSING $f"; missing=1; fi
          done
          exit $missing

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release exists - refreshing all assets (--clobber)"
            gh release upload "$GITHUB_REF_NAME" \
              --clobber --repo "$GITHUB_REPOSITORY" \
              dist/flowforge-* dist/SHA256SUMS*
            # A tag delete+re-push cycle leaves the release as a DRAFT -
            # ensure it is published and marked latest.
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              --latest \
              --repo "$GITHUB_REPOSITORY" \
              dist/flowforge-* dist/SHA256SUMS*
          fi

  image:
    name: Container image (ghcr)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - name: Sign image digest
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}

name: CI

# P4.0: build + test + lint for every component (closes the P0 CI gap).
# The dsl package must be BUILT before server/app tests — they consume
# @flowforge/dsl via file:../dsl (dist output).

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  dsl:
    name: DSL contract (@flowforge/dsl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsl/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dsl-dist
          path: dsl/dist

  server:
    name: Node reference server
    runs-on: ubuntu-latest
    needs: dsl
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dsl-dist
          path: dsl/dist
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    name: Studio UI (React + Vite)
    runs-on: ubuntu-latest
    needs: dsl
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dsl-dist
          path: dsl/dist
      - run: npm ci
      # NOTE: `npm run lint` has ~33 pre-existing scaffold findings
      # (react-hooks v7 / react-refresh rules) — cleanup tracked in P4.5.
      - run: npm run build

  go:
    name: Go control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Embedded templates validate against the frozen DSL
        run: |
          go run ./cmd/flowforge version
          for f in internal/templates/gallery/*.flow.yaml; do
            go run ./cmd/flowforge validate "$f"
          done

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t flowforge:ci .
      - name: "Smoke: container serves /api/v1/health"
        run: |
          docker run -d --name ff-ci -p 18080:8080 flowforge:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:18080/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs ff-ci
          exit 1

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint chart/flowforge
      - run: helm template chart/flowforge > /dev/null
      - name: Render with ingress + disabled persistence
        run: |
          helm lint chart/flowforge \
            --set ingress.enabled=true,ingress.host=ff.example.com,persistence.enabled=false

# flowforge/v1 — portable workflow definition
# Run anywhere: flowforge run vendor-invoice-approval.flow.yaml
apiVersion: flowforge/v1
kind: Workflow
metadata:
  name: vendor-invoice-approval
  version: 1
  createdBy: FlowForge templates
  authoredWith: template
spec:
  description: Extract, validate, approve and post vendor invoices over $10K.
  trigger:
    event: vendor_invoice.created
    source: any
  steps:
    - id: extract_line_items
      type: ai.extract
      name: Extract line items
      params:
        fields: line_items, vendor, total, currency
        model: auto
    - id: validate_vendor
      type: mdm.validate
      name: Validate vendor against master
      params:
        entity: vendors
        match_on: vendor_id, tax_id
        on_mismatch: route_to_steward
    - id: amount_check
      type: condition
      name: Amount over 10000?
      params:
        expression: total > 10000
        on_false: auto_approve
    - id: manager_approval
      type: human.approval
      name: Cost-Center Manager approval
      params:
        approver: Cost-Center Manager
        resolve_via: hr_hierarchy
        sla_hours: "48"
      on_sla_breach: escalate
    - id: vp_escalation
      type: human.approval
      name: Escalation to Finance VP
      params:
        approver: Finance VP
        after_hours: "48"
        condition: previous_step.sla_breached
    - id: post_to_erp
      type: integration.post
      name: Post to ERP
      params:
        system: ERP
        endpoint: erp.inbound.invoices
        mapping: auto

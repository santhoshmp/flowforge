# flowforge/v1 — portable workflow definition
# Run anywhere: flowforge run employee-onboarding.flow.yaml
apiVersion: flowforge/v1
kind: Workflow
metadata:
  name: employee-onboarding
  version: 1
  createdBy: FlowForge templates
  authoredWith: template
spec:
  description: Validate and provision new hires after manager approval.
  trigger:
    event: onboarding.submitted
  steps:
    - id: validate_emp
      type: mdm.validate
      name: Validate employee
      params:
        entity: employees
        match_on: emp_id, email
    - id: mgr_approval
      type: human.approval
      name: Hiring Manager approval
      params:
        approver: Hiring Manager
        sla_hours: "24"
      on_sla_breach: escalate
    - id: notify_it
      type: notify
      name: Notify IT
      params:
        channel: slack
        recipients: "#it-provisioning"
    - id: post_workday
      type: integration.post
      name: Post to Workday
      params:
        system: Workday
        endpoint: workday.hires

# flowforge/v1 — portable workflow definition
# Run anywhere: flowforge run support-ticket-routing.flow.yaml
apiVersion: flowforge/v1
kind: Workflow
metadata:
  name: support-ticket-routing
  version: 1
  createdBy: FlowForge templates
  authoredWith: template
spec:
  description: Classify priority, route critical tickets to the support lead, escalate after 4h.
  trigger:
    event: support_ticket.created
  steps:
    - id: classify
      type: ai.classify
      name: Classify priority
      params:
        model: auto
    - id: priority_check
      type: condition
      name: Priority critical?
      params:
        expression: priority == critical
        on_false: standard_path
    - id: lead_approval
      type: human.approval
      name: Support Lead approval
      params:
        approver: Support Lead
        sla_hours: "4"
      on_sla_breach: escalate
    - id: notify_oncall
      type: notify
      name: Notify on-call
      params:
        channel: slack
        recipients: "#on-call"
    - id: sla_wait
      type: wait
      name: Escalation SLA
      params:
        hours: "4"
